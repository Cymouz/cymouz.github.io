<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photography Resources</title>
  <style>
    #background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
      background: #1a1a1a;
    }

    .blob {
      position: absolute;
      width: 50vw;
      height: 50vw;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.5;
      animation: move 25s infinite cubic-bezier(0.77, 0, 0.18, 1);
    }

    @keyframes move {
      0% {
        transform: translate(0, 0);
      }
      33% {
        transform: translate(30vw, -20vw);
      }
      66% {
        transform: translate(-20vw, 30vw);
      }
      100% {
        transform: translate(0, 0);
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      text-align: center;
      overflow-x: hidden;
      position: relative;
      z-index: 1;
    }

    @keyframes flow {
      0% { 
        transform: translate(0, 0) rotate(0deg);
      }
      25% {
        transform: translate(100px, -150px) rotate(90deg);
      }
      50% {
        transform: translate(200px, 50px) rotate(180deg);
      }
      75% {
        transform: translate(-100px, 100px) rotate(270deg);
      }
      100% {
        transform: translate(0, 0) rotate(360deg);
      }
    }

    .gradient-blob {
      position: fixed;
      width: 150vmax;
      height: 150vmax;
      border-radius: 50%;
      filter: blur(100px);
      will-change: transform;
      mix-blend-mode: normal;
      opacity: 0.5;
      z-index: -1;
      animation-name: flow;
      animation-duration: 35s;
      animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      animation-iteration-count: infinite;
      animation-direction: normal;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 40px;
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 
        -1px -1px 0 #fff,  
         1px -1px 0 #fff,
        -1px  1px 0 #fff,
         1px  1px 0 #fff; /* white outline */
      animation: titleShift 15s ease infinite, glow 3s infinite alternate;
    }

    @keyframes titleShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes glow {
      from { text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff, 0 0 10px rgba(255,255,255,0.3); }
      to   { text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff, 0 0 25px rgba(255,255,255,0.8); }
    }

    .button-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .tilt-btn {
      position: relative;
      background: rgba(34, 34, 34, 0.9);
      color: white;
      border: none;
      padding: 20px 40px;
      font-size: 1.1rem;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
      transform-style: preserve-3d;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      overflow: hidden;
      text-decoration: none;
      display: inline-block;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .tilt-btn::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border-radius: inherit;
      background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), 
        rgba(255,255,255,0.4) 0%, 
        rgba(255,255,255,0.15) 30%, 
        rgba(255,255,255,0) 70%);
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 1;
    }

    .tilt-btn:hover::before {
      opacity: 1;
    }

    /* Click effect */
    .tilt-btn:active {
      transform: scale(0.95) rotateX(0) rotateY(0);
      box-shadow: 0 8px 15px rgba(0,0,0,0.6);
      transition: transform 0.05s ease;
    }
  </style>
</head>
<body>

  <h1 id="title">Photography Resources</h1>

  <div class="button-grid">
    <a href="https://www.rei.com/learn/expert-advice/photo-editing-basics.html" target="_blank" rel="noopener noreferrer" class="tilt-btn">🛠️ Editing Basics</a>
    <a href="https://capturetheatlas.com/photography/photography-guides/" target="_blank" rel="noopener noreferrer" class="tilt-btn">🌍 Guides</a>
    <a href="https://www.adobe.com/products/photoshop-lightroom/login.html" target="_blank" rel="noopener noreferrer" class="tilt-btn">💡 Lightroom</a>
    <a href="https://digital-photography-school.com/total-beginners-guide-to-lightroom-step-by-step/" target="_blank" rel="noopener noreferrer" class="tilt-btn">📖 Beginner’s Lightroom Guide</a>
  </div>

  <script>
    function getRandomColor() {
      const h = Math.random() * 360;
      const s = 60 + Math.random() * 40; // 60-100% saturation
      const l = 45 + Math.random() * 25; // 45-70% lightness
      return `hsla(${h}, ${s}%, ${l}%, 0.4)`; // Lower opacity for better blending
    }

    // Set a gradient background base that's lighter
    document.body.style.background = 'radial-gradient(circle at center, #2d2d2d, #1d1d1d)';
    document.body.style.backgroundSize = '200% 200%';

    // Create multiple blobs
    // Create the background system
    const background = document.createElement('div');
    background.id = 'background';
    document.body.appendChild(background);

    function createBlob() {
      const blob = document.createElement('div');
      blob.className = 'blob';
      
      // Random starting position
      blob.style.left = `${Math.random() * 75}%`;
      blob.style.top = `${Math.random() * 75}%`;
      
      // Random colors
      const hue = Math.random() * 360;
      const sat = 70 + Math.random() * 30;
      const light = 40 + Math.random() * 20;
      blob.style.background = `radial-gradient(circle at center, 
        hsla(${hue}, ${sat}%, ${light}%, 0.8),
        hsla(${hue + 30}, ${sat}%, ${light}%, 0.3))`;
      
      // Random animation timing
      blob.style.animationDelay = `${-Math.random() * 25}s`;
      blob.style.animationDuration = `${25 + Math.random() * 15}s`;
      
      return blob;
    }

    // Create blobs
    for (let i = 0; i < 8; i++) {
      background.appendChild(createBlob());
    }

    // Create background container
    const backgroundContainer = document.createElement('div');
    backgroundContainer.style.position = 'fixed';
    backgroundContainer.style.width = '100%';
    backgroundContainer.style.height = '100%';
    backgroundContainer.style.top = '0';
    backgroundContainer.style.left = '0';
    backgroundContainer.style.overflow = 'hidden';
    backgroundContainer.style.zIndex = '-1'; // Ensure it stays behind content
    
    // Create blob container
    const blobContainer = document.createElement('div');
    blobContainer.style.position = 'absolute';
    blobContainer.style.width = '300%';
    blobContainer.style.height = '300%';
    blobContainer.style.top = '-100%';
    blobContainer.style.left = '-100%';
    blobContainer.style.filter = 'blur(80px)';

    // Create grid of blobs with controlled positioning
    const gridSize = 5; // 5x5 grid
    const cellSize = 100 / gridSize;
    
    // Create blobs in grid
    for (let y = 0; y < gridSize + 1; y++) {
      for (let x = 0; x < gridSize + 1; x++) {
        const baseX = (x * cellSize) - 50;
        const baseY = (y * cellSize) - 50;
        blobContainer.appendChild(createBlob(baseX, baseY, cellSize));
      }
    }

    // Add offset blobs for better coverage
    for (let y = 0; y < gridSize; y++) {
      for (let x = 0; x < gridSize; x++) {
        const baseX = (x * cellSize + cellSize/2) - 50;
        const baseY = (y * cellSize + cellSize/2) - 50;
        blobContainer.appendChild(createBlob(baseX, baseY, cellSize));
      }
    }
    
    // Add blob container to background container
    backgroundContainer.appendChild(blobContainer);
    
    // Insert background at the very beginning of body
    document.body.insertBefore(backgroundContainer, document.body.firstChild);

    document.body.insertBefore(blobContainer, document.body.firstChild);

    // Apply random gradient to title text
    const title = document.getElementById("title");
    title.style.background = randomGradient();
    title.style.webkitBackgroundClip = "text";
    title.style.webkitTextFillColor = "transparent";

    // Tilt + shine effect
    const buttons = document.querySelectorAll('.tilt-btn');
    const maxTilt = 15;

    buttons.forEach(btn => {
      btn.addEventListener('mousemove', (e) => {
        const rect = btn.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const normX = (x / rect.width) * 2 - 1;
        const normY = (y / rect.height) * 2 - 1;

        const rotateX = Math.max(-1, Math.min(1, normY)) * -maxTilt;
        const rotateY = Math.max(-1, Math.min(1, normX)) * maxTilt;

        btn.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

        btn.style.setProperty('--x', `${x}px`);
        btn.style.setProperty('--y', `${y}px`);
      });

      btn.addEventListener('mouseleave', () => {
        btn.style.transform = 'rotateX(0) rotateY(0)';
      });
    });
  </script>
</body>
</html>
