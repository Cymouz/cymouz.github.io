<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photography Resources</title>
  <style>
    #background {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      overflow: visible;
      background: #1a1a1a;
    }

    .blob {
      position: absolute;
      width: 70vw;
      height: 70vw;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.28;
      mix-blend-mode: screen;
      will-change: transform;
      animation: move 30s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }

    @keyframes move {
      0% {
        transform: translate(0, 0);
      }
      33% {
        transform: translate(10vw, -10vw);
      }
      66% {
        transform: translate(-10vw, 10vw);
      }
      100% {
        transform: translate(0, 0);
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    @keyframes flow {
      0% { 
        transform: translate(0, 0) rotate(0deg);
      }
      25% {
        transform: translate(100px, -150px) rotate(90deg);
      }
      50% {
        transform: translate(200px, 50px) rotate(180deg);
      }
      75% {
        transform: translate(-100px, 100px) rotate(270deg);
      }
      100% {
        transform: translate(0, 0) rotate(360deg);
      }
    }

    .gradient-blob {
      position: fixed;
      width: 150vmax;
      height: 150vmax;
      border-radius: 50%;
      filter: blur(100px);
      will-change: transform;
      mix-blend-mode: normal;
      opacity: 0.5;
      z-index: -1;
      animation-name: flow;
      animation-duration: 35s;
      animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      animation-iteration-count: infinite;
      animation-direction: normal;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 40px;
      color: white;
      text-shadow: 0 0 15px rgba(255,255,255,0.5);
      position: relative;
      z-index: 2;
    }

    .button-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .tilt-btn {
      position: relative;
      background: rgba(30, 30, 30, 0.8);
      color: white;
      border: none;
      padding: 20px 40px;
      font-size: 1.1rem;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
      transform-style: preserve-3d;
      transition: all 0.3s ease;
      overflow: hidden;
      text-decoration: none;
      display: inline-block;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      perspective: 1000px;
      z-index: 10;
    }

    .tilt-btn::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border-radius: inherit;
      background: radial-gradient(
        circle at var(--x, 50%) var(--y, 50%), 
        rgba(255,255,255,0.28) 0%, 
        rgba(255,255,255,0.12) 20%, 
        transparent 50%
      );
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.25s ease;
      mix-blend-mode: overlay;
      pointer-events: none;
    }

    .tilt-btn:hover::before {
      opacity: 1;
    }

    /* Click effect */
    .tilt-btn:active {
      transform: scale(0.985);
      box-shadow: 0 5px 15px rgba(0,0,0,0.6);
    }

    /* Improve overall rendering and reduce banding/artifacts */
    #background,
    .blob,
    .gradient-blob {
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-transform: translateZ(0);
      -webkit-backface-visibility: hidden;
    }
  </style>
</head>
<body>

  <h1 id="title">Photography Resources</h1>

  <div class="button-grid">
    <a href="https://www.rei.com/learn/expert-advice/photo-editing-basics.html" target="_blank" rel="noopener noreferrer" class="tilt-btn">🛠️ Editing Basics</a>
    <a href="https://capturetheatlas.com/photography/photography-guides/" target="_blank" rel="noopener noreferrer" class="tilt-btn">🌍 Guides</a>
    <a href="https://www.adobe.com/products/photoshop-lightroom/login.html" target="_blank" rel="noopener noreferrer" class="tilt-btn">💡 Lightroom</a>
    <a href="https://digital-photography-school.com/total-beginners-guide-to-lightroom-step-by-step/" target="_blank" rel="noopener noreferrer" class="tilt-btn">📖 Beginner’s Lightroom Guide</a>
  </div>

  <script>
    function getRandomColor() {
      const h = Math.random() * 360;
      const s = 60 + Math.random() * 40; // 60-100% saturation
      const l = 45 + Math.random() * 25; // 45-70% lightness
      return `hsla(${h}, ${s}%, ${l}%, 0.4)`; // Lower opacity for better blending
    }

    // Initialize button effects
    const tiltButtons = document.querySelectorAll('.tilt-btn');
    
    tiltButtons.forEach(btn => {
      btn.addEventListener('mousemove', e => {
        const rect = btn.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        // Calculate rotation based on mouse position
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = ((y - centerY) / centerY) * -10;
        const rotateY = ((x - centerX) / centerX) * 10;
        
        // Update shine effect position
        btn.style.setProperty('--x', `${x}px`);
        btn.style.setProperty('--y', `${y}px`);
        
        // Apply tilt
        btn.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
      });

      btn.addEventListener('mouseleave', () => {
        btn.style.transform = 'perspective(1000px) rotateX(0) rotateY(0)';
      });
    });

    // Set dark background
    document.body.style.background = '#1a1a1a';

    // Create the background system
    const background = document.createElement('div');
    background.id = 'background';
    document.body.appendChild(background);

    function createBlob(x, y) {
      const blob = document.createElement('div');
      blob.className = 'blob';
      
      // Position within grid cell with some randomness
      const randomX = x + (Math.random() * 20 - 10); // ±10% random offset
      const randomY = y + (Math.random() * 20 - 10);
      
      blob.style.left = `${randomX}%`;
      blob.style.top = `${randomY}%`;
      
      // Brighter colors with higher saturation and lightness
      const hue = Math.random() * 360;
      const sat = 70 + Math.random() * 30; // 70-100% saturation
      const light = 60 + Math.random() * 20; // 60-80% lightness
      blob.style.background = `radial-gradient(circle at center, 
        hsla(${hue}, ${sat}%, ${light}%, 0.3),
        hsla(${hue + 30}, ${sat}%, ${light - 10}%, 0.1))`;
      
      // Smoother animation timing
      blob.style.animationDelay = `${-Math.random() * 30}s`;
      blob.style.animationDuration = `${30 + Math.random() * 20}s`;
      
      return blob;
    }

    // Create dense grid of blobs with overlapping
    const gridSize = 6; // 6x6 grid
    const spacing = 100 / (gridSize - 1); // Ensure coverage to edges

    // Create main grid of blobs
    for (let y = 0; y <= gridSize - 1; y++) {
      for (let x = 0; x <= gridSize - 1; x++) {
        background.appendChild(createBlob(x * spacing, y * spacing));
      }
    }

    // Add offset blobs between grid points for better coverage
    for (let y = 0; y < gridSize - 1; y++) {
      for (let x = 0; x < gridSize - 1; x++) {
        background.appendChild(createBlob(x * spacing + spacing/2, y * spacing + spacing/2));
      }
    }

    // Add diagonal offset blobs for even more coverage
    for (let y = 0; y < gridSize - 1; y++) {
      for (let x = 0; x < gridSize - 1; x++) {
        background.appendChild(createBlob(
          x * spacing + spacing/3,
          y * spacing + spacing/3
        ));
        background.appendChild(createBlob(
          x * spacing + spacing*2/3,
          y * spacing + spacing*2/3
        ));
      }
    }

    // Add extra random blobs for more variety
    for (let i = 0; i < 16; i++) {
      background.appendChild(createBlob(
        Math.random() * 100,
        Math.random() * 100
      ));
    }

    // No need for these anymore as we have simplified the title styling
    // and already have button effects above
  </script>
</body>
</html>
