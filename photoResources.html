<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photography Resources</title>
  <script>
    window.addEventListener('load', function() {
      document.body.style.animationDelay = (-Math.random() * 20) + 's';
    });
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      text-align: center;
      overflow-x: hidden;
      /* Background gradient and animation will be set by JavaScript */
    }

    @keyframes flow {
      0% { 
        transform: translate(0, 0) rotate(0deg);
      }
      25% {
        transform: translate(100px, -150px) rotate(90deg);
      }
      50% {
        transform: translate(200px, 50px) rotate(180deg);
      }
      75% {
        transform: translate(-100px, 100px) rotate(270deg);
      }
      100% {
        transform: translate(0, 0) rotate(360deg);
      }
    }

    .gradient-blob {
      position: fixed;
      width: 100vmax;
      height: 100vmax;
      border-radius: 50%;
      filter: blur(80px);
      will-change: transform;
      mix-blend-mode: screen;
      opacity: 0.6;
      z-index: -1;
      animation-name: flow;
      animation-duration: 35s;
      animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      animation-iteration-count: infinite;
      animation-direction: normal;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 40px;
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 
        -1px -1px 0 #fff,  
         1px -1px 0 #fff,
        -1px  1px 0 #fff,
         1px  1px 0 #fff; /* white outline */
      animation: titleShift 15s ease infinite, glow 3s infinite alternate;
    }

    @keyframes titleShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes glow {
      from { text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff, 0 0 10px rgba(255,255,255,0.3); }
      to   { text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff, 0 0 25px rgba(255,255,255,0.8); }
    }

    .button-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }

    .tilt-btn {
      position: relative;
      background: #222;
      color: white;
      border: none;
      padding: 20px 40px;
      font-size: 1.1rem;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
      transform-style: preserve-3d;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      overflow: hidden;
      text-decoration: none;
      display: inline-block;
    }

    .tilt-btn::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border-radius: inherit;
      background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), 
        rgba(255,255,255,0.4) 0%, 
        rgba(255,255,255,0.15) 30%, 
        rgba(255,255,255,0) 70%);
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }

    .tilt-btn:hover::before {
      opacity: 1;
    }

    /* Click effect */
    .tilt-btn:active {
      transform: scale(0.95) rotateX(0) rotateY(0);
      box-shadow: 0 8px 15px rgba(0,0,0,0.6);
      transition: transform 0.05s ease;
    }
  </style>
</head>
<body>

  <h1 id="title">Photography Resources</h1>

  <div class="button-grid">
    <a href="https://www.rei.com/learn/expert-advice/photo-editing-basics.html" target="_blank" rel="noopener noreferrer" class="tilt-btn">🛠️ Editing Basics</a>
    <a href="https://capturetheatlas.com/photography/photography-guides/" target="_blank" rel="noopener noreferrer" class="tilt-btn">🌍 Guides</a>
    <a href="https://www.adobe.com/products/photoshop-lightroom/login.html" target="_blank" rel="noopener noreferrer" class="tilt-btn">💡 Lightroom</a>
    <a href="https://digital-photography-school.com/total-beginners-guide-to-lightroom-step-by-step/" target="_blank" rel="noopener noreferrer" class="tilt-btn">📖 Beginner’s Lightroom Guide</a>
  </div>

  <script>
    function getRandomColor() {
      const h = Math.random() * 360;
      const s = 70 + Math.random() * 30;
      const l = 40 + Math.random() * 20;
      return `hsla(${h}, ${s}%, ${l}%, 0.7)`;
    }

    // Set a gradient background base
    document.body.style.background = 'radial-gradient(circle at center, #2a2a2a, #1a1a1a)';

    // Create multiple blobs
    function createBlob() {
      const blob = document.createElement('div');
      blob.className = 'gradient-blob';
      
      // Position blobs with wider range to allow movement off-screen
      blob.style.left = `${Math.random() * 200 - 50}%`;
      blob.style.top = `${Math.random() * 200 - 50}%`;
      
      // Create smooth, flowing gradients
      const color1 = getRandomColor();
      const color2 = getRandomColor();
      const color3 = getRandomColor();
      blob.style.background = `
        radial-gradient(
          circle at 30% 70%,
          ${color1} 0%,
          ${color2} 45%,
          ${color3} 100%
        )
      `;
      
      // Randomize animation for flowing effect
      const duration = 35 + Math.random() * 40; // Longer duration for smoother flow
      const delay = -Math.random() * 35; // More varied delays
      
      // Apply animation properties
      blob.style.animationDuration = `${duration}s`;
      blob.style.animationDelay = `${delay}s`;
      
      return blob;
    }

    // Add multiple blobs
    const blobContainer = document.createElement('div');
    blobContainer.style.position = 'fixed';
    blobContainer.style.width = '200%';
    blobContainer.style.height = '200%';
    blobContainer.style.top = '-50%';
    blobContainer.style.left = '-50%';
    blobContainer.style.overflow = 'hidden';
    blobContainer.style.zIndex = '-1';
    blobContainer.style.filter = 'blur(60px)'; // Increased blur for smoother blending

    // Create more blobs for fuller coverage
    for (let i = 0; i < 12; i++) {
      blobContainer.appendChild(createBlob());
    }

    document.body.insertBefore(blobContainer, document.body.firstChild);

    // Apply random gradient to title text
    const title = document.getElementById("title");
    title.style.background = randomGradient();
    title.style.webkitBackgroundClip = "text";
    title.style.webkitTextFillColor = "transparent";

    // Tilt + shine effect
    const buttons = document.querySelectorAll('.tilt-btn');
    const maxTilt = 15;

    buttons.forEach(btn => {
      btn.addEventListener('mousemove', (e) => {
        const rect = btn.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const normX = (x / rect.width) * 2 - 1;
        const normY = (y / rect.height) * 2 - 1;

        const rotateX = Math.max(-1, Math.min(1, normY)) * -maxTilt;
        const rotateY = Math.max(-1, Math.min(1, normX)) * maxTilt;

        btn.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

        btn.style.setProperty('--x', `${x}px`);
        btn.style.setProperty('--y', `${y}px`);
      });

      btn.addEventListener('mouseleave', () => {
        btn.style.transform = 'rotateX(0) rotateY(0)';
      });
    });
  </script>
</body>
</html>
