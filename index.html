/* --- Update Banner Styles --- */
.update-banner {
  position: fixed;
  bottom: calc(20px + env(safe-area-inset-bottom));

.update-banner.show {

}

    /* =========================================
       LAYOUT: Background, Wrapper, Content 
       ========================================= */

    html {
      width: 100%;
      height: 100%;
      background-color: #3d0a3d;
      overflow: hidden;
    }

    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
      overflow-y: auto;
      overflow-x: hidden;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    /* Fixed Background Layer */
    #fixed-bg {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: linear-gradient(45deg, #1a0033, #4a0a4a, #6b1a3a);
      background-size: 400% 400%;
      animation: bgShift 15s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes bgShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* The Content Wrapper */
    .main-wrapper {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
      box-sizing: border-box;
    }

    /* Safe Centering: Uses margins so content can overflow natively */
    .content-container {
      margin: auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    /* Title with animated gradient */
    h1 {
      font-size: clamp(2rem, 8vw, 3.5rem);
      margin: 0 20px 16px;
      background: linear-gradient(135deg, #b366ff 0%, #ff4d6d 50%, #b366ff 100%);
      background-size: 200% 100%;
      background-position: 0% 50%;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleShift 12s linear infinite;
      transition: none;
      
      -webkit-touch-callout: none; 
      touch-action: manipulation;  
      user-select: none;
    }

    @keyframes titleShift {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    /* Bio section */
    .bio {
      font-size: clamp(1rem, 3vw, 1.1rem);

      max-width: 600px;

    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 0.95; transform: translateY(0); }
    }

    /* Links section title - desktop only */
    .links-title {

    .links-header {

    .links-toggle {

    .socials-mobile {
      max-height: 0;
      overflow: hidden;
      margin-bottom: 0;

      transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1),

      display: flex;
      margin-top: 0;
      padding: 0;

    .socials-mobile.open {

    }

    /* Social links container - desktop */
    .socials {
      display: flex;
      flex-wrap: wrap;
      gap: clamp(10px, 2vw, 12px);
      justify-content: center;
      margin-bottom: 32px;
      max-width: 100%;
      animation: slideUp 0.8s ease-out 0.4s backwards;
      padding: 0 10px;
    }

    /* Social button with tilt + shine */
    .social-btn {
      position: relative;
      background: rgba(179, 102, 255, 0.15);
      color: white;
      border: 1px solid rgba(179, 102, 255, 0.25);
      padding: clamp(10px, 2.5vw, 12px) clamp(16px, 4vw, 20px);
      font-size: clamp(0.8rem, 2vw, 0.95rem);
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
      transform-style: preserve-3d;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      overflow: hidden;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      will-change: transform;
      box-sizing: border-box;
      backdrop-filter: blur(10px);
    }

    .social-btn::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at var(--x, 50%) var(--y, 50%),
        rgba(255,255,255,0.4) 0%,
        rgba(255,255,255,0.15) 30%,
        rgba(255,255,255,0) 70%);
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }

    .social-btn:hover::before { opacity: 1; }
    .social-btn:active {
      transform: scale(0.95) rotateX(0) rotateY(0);
      box-shadow: 0 8px 15px rgba(0,0,0,0.6);
      transition: transform 0.05s ease;
    }

    /* Mobile optimizations */
    @media (max-width: 768px) {
      .main-wrapper {
        padding: calc(15px + env(safe-area-inset-top)) 15px calc(15px + env(safe-area-inset-bottom)) 15px;
      }

      h1 { margin-bottom: 12px; }
      .bio { margin-bottom: 20px; padding: 0 15px; }
      .socials, .links-title { display: none; }

      .links-section {
        display: block;
        width: 100%;
        padding: 0 15px;
        box-sizing: border-box;
      }

      .social-btn {
        width: 100%;
        font-size: 1rem;
        padding: 18px 20px;
        justify-content: center;
        box-shadow: none;
        border: 1px solid rgba(179, 102, 255, 0.4);
        box-sizing: border-box;
      }

      .social-btn:hover {
        background: rgba(255, 102, 204, 0.15);
        border-color: rgba(179, 102, 255, 0.6);
      }

      @media (hover: none) and (pointer: coarse) {
        .social-btn { transform-style: flat; }
      }
    }

    @media (max-width: 480px) {
      .main-wrapper { padding: calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)) 12px; }
      .socials-mobile.open { gap: 8px; }
      .social-btn { padding: 12px 14px; font-size: 0.9rem; }
    }

    @media (min-width: 769px) {
      .links-section { display: none; }
      .socials-mobile { display: none; }
      .links-title { display: block; }
    }

  </style>

  <script>
    const linksHeader = document.querySelector('.links-header');
    const mobileSocials = document.getElementById('mobile-socials');
    const linksToggle = document.querySelector('.links-toggle');
    let isLinksOpen = false;

    if (linksHeader) {
      linksHeader.addEventListener('click', () => {
        isLinksOpen = !isLinksOpen;
        mobileSocials.classList.toggle('open', isLinksOpen);
        linksToggle.classList.toggle('open', isLinksOpen);
      });
    }

    const canHover = window.matchMedia('(hover: hover)').matches || window.matchMedia('(any-hover: hover)').matches;

    let mouseX = 0;
    let mouseY = 0;
    let targetBackgroundX = 0;
    let targetBackgroundY = 0;
    let currentBackgroundX = 0;
    let currentBackgroundY = 0;

    const socialBtns = document.querySelectorAll('.social-btn');
    const maxTilt = 12;
    
    if (canHover) {
      socialBtns.forEach(btn => {
        btn.addEventListener('mousemove', (e) => {
          const rect = btn.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const normX = (x / rect.width) * 2 - 1;
          const normY = (y / rect.height) * 2 - 1;
          const rotateX = Math.max(-1, Math.min(1, normY)) * -maxTilt;
          const rotateY = Math.max(-1, Math.min(1, normX)) * maxTilt;
          btn.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
          btn.style.setProperty('--x', `${x}px`);
          btn.style.setProperty('--y', `${y}px`);
        });
        
        btn.addEventListener('mouseleave', () => {
          btn.style.transform = 'rotateX(0) rotateY(0)';
        });
      });
    } else {
      socialBtns.forEach(btn => {
        btn.addEventListener('touchstart', () => {
          btn.style.background = 'rgba(179, 102, 255, 0.25)';
        });
        btn.addEventListener('touchend', () => {
          btn.style.background = 'rgba(179, 102, 255, 0.15)';
        });
      });
    }

    const style = document.createElement('style');
    style.textContent = `
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
    `;
    document.head.appendChild(style);

    if (canHover) {
      document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        targetBackgroundX = (mouseX / window.innerWidth) * 10 - 5;
        targetBackgroundY = (mouseY / window.innerHeight) * 10 - 5;
      });

      function updateParallax() {
        currentBackgroundX += (targetBackgroundX - currentBackgroundX) * 0.1;
        currentBackgroundY += (targetBackgroundY - currentBackgroundY) * 0.1;
        
        const fixedBg = document.getElementById('fixed-bg');
        if (fixedBg) {
          fixedBg.style.backgroundPosition = `${currentBackgroundX}% ${currentBackgroundY}%`;
        }
        
        requestAnimationFrame(updateParallax);
      }
      
      updateParallax();
    }

    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => { }, 250);
    });
  </script>
